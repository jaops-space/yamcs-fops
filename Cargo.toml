[package]
name = "fops"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive", "env"] }
rustc-hash = "2"
parking_lot = "0.12"
anyhow = "1"
libc = "0.2"
sha2 = "0.10"
form_urlencoded = "1"

[profile.release]
debug = 1
