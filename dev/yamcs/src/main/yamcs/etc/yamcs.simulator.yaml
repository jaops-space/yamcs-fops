# fops development instance: the Yamcs PUS simulator, embedded in Yamcs (no
# separate process), over TCP (TM on 10015, TC on 10025). Configuration and
# MDB from the pus example of the Yamcs repository (examples/pus), without CFDP.
services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers: [jvm, fs]
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.simulator.SimulatorCommander
    args:
      type: pus
      tctm:
        tmPort: 10015
        tcPort: 10025
  - class: org.yamcs.pus.PusEventDecoder
    args:
      eventIdParameter: /PUS5/event_id
      eventTemplateFile: etc/events.json

dataLinks:
  - name: tm_realtime
    class: org.yamcs.tctm.TcpTmDataLink
    stream: tm_realtime
    host: localhost
    port: 10015
    # give the embedded simulator some time to start
    initialDelay: 2000
    packetPreprocessorClassName: org.yamcs.pus.PusPacketPreprocessor
    packetPreprocessorArgs:
      errorDetection:
        type: CRC-16-CCIIT
      timeEncoding:
        type: CUC
        epoch: UNIX

  - name: tc_realtime
    class: org.yamcs.tctm.TcpTcDataLink
    stream: tc_realtime
    host: localhost
    port: 10025
    initialDelay: 2000
    commandPostprocessorClassName: org.yamcs.pus.PusCommandPostprocessor
    commandPostprocessorArgs:
      errorDetection:
        type: CRC-16-CCIIT
      timeEncoding:
        implicitPfield: false
        pfield: 0x2f
      pus22:
        subScheduleId:
          bytes: 1
          default: 1
        groupId:
          bytes: 1
          default: 1

mdb:
  - type: xtce
    spec: mdb/dt.xml
  - type: xtce
    spec: mdb/pus.xml
  - type: xtce
    spec: mdb/pus5.xml
  - type: xtce
    spec: mdb/pus17.xml
  - type: xtce
    spec: mdb/pus19.xml
  - type: xtce
    spec: mdb/pus22.xml
  - type: xtce
    spec: mdb/landing.xml

streamConfig:
  tm:
    - name: tm_realtime
      processor: realtime
  invalidTm: invalid_tm_stream
  cmdHist: [cmdhist_realtime, cmdhist_dump]
  event: [events_realtime, events_dump]
  param: [pp_realtime, sys_param, proc_param]
  parameterAlarm: [alarms_realtime]
  eventAlarm: [event_alarms_realtime]
  tc:
    - name: tc_realtime
      processor: realtime
